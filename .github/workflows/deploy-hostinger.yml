# Push-to-deploy for Hostinger VPS Docker Manager.
#
# Hostinger API `content` field (per official SDK docs):
# - A GitHub repo URL `https://github.com/owner/repo` is resolved to docker-compose on
#   the default branch and used with full repo context for `build: .` (correct for this project).
# - A raw compose URL only sends YAML; it does not ship Dockerfile/source, so avoid that here.
#
# Private repo: add a deploy key on the VPS and to the repo (Hostinger docs), then this URL still works.
#
# Secrets: HOSTINGER_API_KEY, RESEND_API_KEY
# Optional secrets: CONTACT_TO_EMAIL, CONTACT_FROM_EMAIL
# Variable or secret: HOSTINGER_VM_ID (digits only, e.g. 1568010)

name: Deploy to Hostinger VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Hostinger configuration
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID != '' && vars.HOSTINGER_VM_ID || secrets.HOSTINGER_VM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_KEY:-}" ]; then
            echo "::error::Add Actions secret HOSTINGER_API_KEY (hPanel → Profile → API)."
            exit 1
          fi
          if [ -z "${VM_ID:-}" ]; then
            echo "::error::Set Actions variable or secret HOSTINGER_VM_ID (numeric id only, e.g. 1568010)."
            exit 1
          fi
          echo "Hostinger API key and VM id are configured."

      - name: Deploy to Hostinger VPS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID != '' && vars.HOSTINGER_VM_ID || secrets.HOSTINGER_VM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
        run: |
          set -euo pipefail
          VM_ID=$(printf '%s' "$VM_ID" | tr -d '\r\n\t ' | sed 's/^"//;s/"$//')
          if ! [[ "$VM_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::HOSTINGER_VM_ID must be digits only (length ${#VM_ID}). Example: 1568010"
            exit 1
          fi

          CONTENT_URL="https://github.com/${GITHUB_REPOSITORY}"
          ENVIRONMENT=$(printf '%s\n' \
            "NODE_ENV=production" \
            "PORT=3000" \
            "RESEND_API_KEY=${RESEND_API_KEY:-}" \
            "CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-}" \
            "CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-}")

          BODY=$(jq -n \
            --arg content "$CONTENT_URL" \
            --arg project_name "portfolio-website" \
            --arg environment "$ENVIRONMENT" \
            '{project_name: $project_name, content: $content, environment: $environment} | with_entries(select(.value != ""))')

          echo "POST …/virtual-machines/${VM_ID}/docker"
          echo "content: ${CONTENT_URL} (Hostinger clones repo + compose on default branch)"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VM_ID}/docker")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Hostinger API HTTP ${HTTP_STATUS}. Check API key permissions, VM id, private-repo deploy key on VPS, and message above."
            exit 1
          fi
          echo "Hostinger accepted deploy (HTTP ${HTTP_STATUS})."
